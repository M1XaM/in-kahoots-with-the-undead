name: Get All Wings (first, miss or hit)
$kind: http-request
description: |-
  Every map GET (rooms, wings, spawn points) is cached in the scope world:map (300 s) on the shard that owns it.
  The first read after a change is a miss (from a replica of world-db), later ones a hit.
method: GET
url: "{{brokerUrl}}/call/world/world/wings"
headers:
  - key: X-Internal-Key
    value: "changeme"
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const cache = pm.response.headers.get('X-Cache');
      console.log('X-Cache', cache, 'X-Cache-Shard', pm.response.headers.get('X-Cache-Shard'));
      pm.test('cached answer', () => pm.expect(['hit', 'miss']).to.include(cache));
      pm.collectionVariables.set('worldCacheShard', pm.response.headers.get('X-Cache-Shard'));
order: 1000
