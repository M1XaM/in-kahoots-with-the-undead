name: Action Completed - chop_benches
$kind: http-request
method: POST
url: "http://localhost:8091/topics/game.action_completed/events"
description: "Publishes game.action_completed; the broker delivers it to Resource, which credits wood, then relays resource.gathered from its outbox back to the broker (Broker.Publish)."
headers:
  - key: Content-Type
    value: "application/json"
  - key: X-Internal-Key
    value: "changeme"
body:
  type: json
  content: |
    {
      "eventId": "{{$guid}}",
      "type": "game.action_completed",
      "version": 1,
      "occurredAt": "2026-09-25T10:00:00Z",
      "payload": {
        "actionId": "{{$guid}}",
        "sessionId": "7a90",
        "playerId": 42,
        "type": "chop_benches",
        "roomId": 3,
        "nodeId": null,
        "completedAt": "2026-09-25T10:00:00Z"
      }
    }
