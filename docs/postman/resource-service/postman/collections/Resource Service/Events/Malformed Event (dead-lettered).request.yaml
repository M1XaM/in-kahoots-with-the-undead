name: Malformed Event (dead-lettered)
$kind: http-request
method: POST
url: "http://localhost:8091/topics/player.registered/events"
description: "playerId is not a number: Resource answers 400 (INVALID_ARGUMENT over gRPC) and the broker moves the event to the dead letter channel at once instead of retrying."
headers:
  - key: Content-Type
    value: "application/json"
  - key: X-Internal-Key
    value: "changeme"
body:
  type: json
  content: |
    {
      "eventId": "{{$guid}}",
      "type": "player.registered",
      "version": 1,
      "occurredAt": "2026-09-25T10:00:00Z",
      "payload": {
        "playerId": "not-a-number",
        "username": "razvan"
      }
    }
