name: Create Recipe
$kind: http-request
method: POST
url: http://localhost:8088/crafting/recipes
headers:
  - key: Content-Type
    value: application/json
  - key: X-Internal-Key
    value: changeme
body:
  type: json
  content: |
    {
      "name": "Barricade Kit",
      "inputs": { "wood": 4, "metal": 2 },
      "output": { "itemId": "barricade_kit", "name": "Barricade Kit", "quantity": 1 },
      "requires": {}
    }
