name: Player Leveled Up
$kind: http-request
method: POST
url: http://localhost:8088/crafting/internal/events
headers:
  - key: Content-Type
    value: application/json
  - key: X-Internal-Key
    value: changeme
body:
  type: json
  content: |
    {
      "eventId": "{{$guid}}",
      "type": "player.leveled_up",
      "version": 1,
      "occurredAt": "2026-09-23T12:00:00Z",
      "payload": { "playerId": 1, "level": 3 }
    }
