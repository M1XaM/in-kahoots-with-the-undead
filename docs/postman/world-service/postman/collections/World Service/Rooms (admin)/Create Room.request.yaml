name: Create Room
$kind: http-request
method: POST
url: "http://localhost:8091/call/world/world/rooms"
description: "Service to service: through the broker with X-Internal-Key."
headers:
  - key: Content-Type
    value: "application/json"
  - key: X-Internal-Key
    value: "changeme"
body:
  type: json
  content: |
    {
      "name": "Chem Lab",
      "type": "laboratory",
      "wingId": 2,
      "resourceNode": { "resourceType": "metal" }
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.collectionVariables.set('roomId', pm.response.json().roomId);
