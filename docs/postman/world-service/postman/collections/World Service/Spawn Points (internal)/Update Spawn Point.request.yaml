name: Update Spawn Point
$kind: http-request
method: PUT
url: "http://localhost:8091/call/world/world/spawn-points/{{pointId}}"
description: "Service to service: through the broker with X-Internal-Key."
headers:
  - key: Content-Type
    value: "application/json"
  - key: X-Internal-Key
    value: "changeme"
body:
  type: json
  content: |
    {
      "roomId": 3,
      "zombieTypes": ["dean", "janitor"]
    }
