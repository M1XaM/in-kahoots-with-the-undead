name: Update Spawn Point
$kind: http-request
method: PUT
url: "http://localhost:8080/world/spawn-points/{{pointId}}"
headers:
  - key: Content-Type
    value: "application/json"
  - key: X-Internal-Key
    value: "changeme"
body:
  type: json
  content: |
    {
      "roomId": 3,
      "zombieTypes": ["dean", "janitor"]
    }
