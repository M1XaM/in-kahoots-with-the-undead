name: Exam Completed
$kind: http-request
method: POST
url: http://localhost:8084/world/internal/events
headers:
  - key: Content-Type
    value: application/json
  - key: X-Internal-Key
    value: changeme
body:
  type: json
  content: |
    {
      "eventId": "{{$guid}}",
      "type": "exam.completed",
      "version": 1,
      "occurredAt": "2026-09-24T12:00:00Z",
      "payload": { "examId": 17, "playerId": 1, "subject": "math", "passed": true, "grade": 8 }
    }
