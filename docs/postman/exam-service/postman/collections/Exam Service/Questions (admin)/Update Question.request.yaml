name: Update Question
$kind: http-request
method: PUT
url: "http://localhost:8080/exams/questions/{{questionId}}"
headers:
  - key: Content-Type
    value: "application/json"
  - key: X-Internal-Key
    value: "changeme"
body:
  type: json
  content: |
    {
      "subject": "math",
      "text": "12 / 3 = ?",
      "options": ["2", "3", "4", "6"],
      "correctOption": 2
    }
