name: Craft Recipe
$kind: http-request
method: POST
url: "{{craftingUrl}}/crafting/crafts"
headers:
  - key: Content-Type
    value: "application/json"
  - key: X-Player-Id
    value: "1"
  - key: Idempotency-Key
    value: "{{$guid}}"
body:
  type: json
  content: |-
    {
      "recipeId": 1
    }
order: 1000
