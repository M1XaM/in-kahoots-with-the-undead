name: Update Question
$kind: http-request
method: PUT
url: "{{baseUrl}}/exams/questions/{{questionId}}"
headers:
  - key: Content-Type
    value: "application/json"
  - key: X-Internal-Key
    value: "changeme"
body:
  type: json
  content: |-
    {
      "subject": "math",
      "text": "12 / 3 = ?",
      "options": ["2", "3", "4", "6"],
      "correctOption": 2
    }
order: 4000
