name: Create Question
$kind: http-request
description: |-
  Admin, service to service: through the broker with X-Internal-Key.
method: POST
url: "{{brokerUrl}}/call/exam/exams/questions"
headers:
  - key: Content-Type
    value: "application/json"
  - key: X-Internal-Key
    value: "changeme"
body:
  type: json
  content: |-
    {
      "subject": "math",
      "text": "12 / 4 = ?",
      "options": ["2", "3", "4", "6"],
      "correctOption": 1
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.collectionVariables.set('questionId', pm.response.json().questionId);
order: 3000
