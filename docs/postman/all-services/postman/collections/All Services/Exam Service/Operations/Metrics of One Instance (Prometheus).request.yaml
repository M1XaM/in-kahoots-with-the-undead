name: Metrics of One Instance (Prometheus)
$kind: http-request
description: |-
  What Prometheus scrapes from every Exam replica: http_requests_total, http_request_duration_seconds, active_tasks, max_concurrent_tasks, upstream_calls_total, events_published_total and the Node.js process metrics.
method: GET
url: "{{brokerUrl}}/call/exam/metrics"
headers:
  - key: X-Internal-Key
    value: "changeme"
order: 3000
