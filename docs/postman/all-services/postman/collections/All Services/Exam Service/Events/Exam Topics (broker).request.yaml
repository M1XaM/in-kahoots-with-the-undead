name: Exam Topics (broker)
$kind: http-request
description: |-
  Exam publishes exam.completed to the broker topic of the same name (from its outbox, in order); World, Game and Crafting subscribe to it through their Discovery registration. Shows producers, subscribers, queue depth and deliveries.
method: GET
url: "{{brokerUrl}}/topics"
headers:
  - key: X-Internal-Key
    value: "changeme"
order: 1000
