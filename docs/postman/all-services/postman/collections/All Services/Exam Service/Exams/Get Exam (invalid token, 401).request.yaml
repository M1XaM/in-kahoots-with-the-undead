name: "Get Exam (invalid token, 401)"
$kind: http-request
description: |-
  The gateway validates the Authorization header itself and answers 401 UNAUTHENTICATED; Exam is never reached and never sees the header.
method: GET
url: "{{baseUrl}}/exams/{{examId}}"
headers:
  - key: Authorization
    value: "Bearer not-a-valid-token"
order: 3000
