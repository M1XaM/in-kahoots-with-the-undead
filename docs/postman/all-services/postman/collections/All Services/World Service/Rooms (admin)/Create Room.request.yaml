name: Create Room
$kind: http-request
description: |-
  Service to service: through the broker with X-Internal-Key.
method: POST
url: "{{brokerUrl}}/call/world/world/rooms"
headers:
  - key: Content-Type
    value: "application/json"
  - key: X-Internal-Key
    value: "changeme"
body:
  type: json
  content: |-
    {
      "name": "Chem Lab",
      "type": "laboratory",
      "wingId": 2,
      "resourceNode": { "resourceType": "metal" }
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.collectionVariables.set('roomId', pm.response.json().roomId);
order: 1000
