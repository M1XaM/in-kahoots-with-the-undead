name: Update Room
$kind: http-request
description: |-
  Service to service: through the broker with X-Internal-Key.
method: PUT
url: "{{brokerUrl}}/call/world/world/rooms/{{roomId}}"
headers:
  - key: Content-Type
    value: "application/json"
  - key: X-Internal-Key
    value: "changeme"
body:
  type: json
  content: |-
    {
      "name": "Chem Lab 2",
      "type": "laboratory",
      "wingId": 2,
      "resourceNode": null
    }
order: 2000
