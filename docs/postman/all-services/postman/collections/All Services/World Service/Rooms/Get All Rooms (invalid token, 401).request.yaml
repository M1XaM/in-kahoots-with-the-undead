name: "Get All Rooms (invalid token, 401)"
$kind: http-request
description: |-
  The gateway validates the Authorization header itself and answers 401 UNAUTHENTICATED; World is never reached and never sees the header.
method: GET
url: "{{baseUrl}}/world/rooms"
headers:
  - key: Authorization
    value: "Bearer not-a-valid-token"
order: 4000
