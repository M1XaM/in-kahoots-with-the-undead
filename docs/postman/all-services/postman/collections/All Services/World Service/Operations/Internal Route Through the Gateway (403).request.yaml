name: Internal Route Through the Gateway (403)
$kind: http-request
description: |-
  A logged-in player cannot use an internal route: the gateway forwards it through the broker marked X-Caller: client and World answers 403 FORBIDDEN (routes under /internal/ are not served by the gateway at all).
method: GET
url: "{{baseUrl}}/world/spawn-points"
headers:
  - key: Authorization
    value: "Bearer {{accessToken}}"
order: 2000
