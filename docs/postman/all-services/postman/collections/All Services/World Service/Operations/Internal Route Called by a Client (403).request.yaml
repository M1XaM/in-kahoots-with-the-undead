name: Internal Route Called by a Client (403)
$kind: http-request
description: |-
  The broker sends its own key on every call, so the gateway marks a player's request with X-Caller: client. World then treats it as the player's: internal-only routes answer 403 FORBIDDEN.
method: GET
url: "{{brokerUrl}}/call/world/world/spawn-points"
headers:
  - key: X-Internal-Key
    value: "changeme"
  - key: X-Caller
    value: "client"
  - key: X-Player-Id
    value: "{{playerId}}"
order: 1000
