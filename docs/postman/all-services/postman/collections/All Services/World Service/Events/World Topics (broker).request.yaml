name: World Topics (broker)
$kind: http-request
description: |-
  World subscribes to exam.completed (its Discovery registration lists it) and produces world.wing_unlocked (Game and Crafting subscribe): queue depth, deliveries and dead letters.
method: GET
url: "{{brokerUrl}}/topics"
headers:
  - key: X-Internal-Key
    value: "changeme"
order: 4000
