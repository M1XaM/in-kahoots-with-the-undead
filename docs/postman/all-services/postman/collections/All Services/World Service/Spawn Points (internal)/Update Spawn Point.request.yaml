name: Update Spawn Point
$kind: http-request
description: |-
  Service to service: through the broker with X-Internal-Key.
method: PUT
url: "{{brokerUrl}}/call/world/world/spawn-points/{{pointId}}"
headers:
  - key: Content-Type
    value: "application/json"
  - key: X-Internal-Key
    value: "changeme"
body:
  type: json
  content: |-
    {
      "roomId": 3,
      "zombieTypes": ["dean", "janitor"]
    }
order: 4000
