name: Create Spawn Point
$kind: http-request
description: |-
  Service to service: through the broker with X-Internal-Key.
method: POST
url: "{{brokerUrl}}/call/world/world/spawn-points"
headers:
  - key: Content-Type
    value: "application/json"
  - key: X-Internal-Key
    value: "changeme"
body:
  type: json
  content: |-
    {
      "roomId": 3,
      "zombieTypes": ["dean"]
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.collectionVariables.set('pointId', pm.response.json().pointId);
order: 3000
