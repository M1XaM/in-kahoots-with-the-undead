name: Create Wing
$kind: http-request
description: |-
  Service to service: through the broker with X-Internal-Key.
method: POST
url: "{{brokerUrl}}/call/world/world/wings"
headers:
  - key: Content-Type
    value: "application/json"
  - key: X-Internal-Key
    value: "changeme"
body:
  type: json
  content: |-
    {
      "name": "Chemistry Wing {{$timestamp}}",
      "unlocked": false,
      "unlockedBySubject": "chemistry"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const wing = pm.response.json();
      pm.collectionVariables.set('wingId', wing.wingId);
      pm.collectionVariables.set('wingName', wing.name);
order: 1000
