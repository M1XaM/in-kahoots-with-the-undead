name: Call Base Players (send several times)
$kind: http-request
method: GET
url: "{{brokerUrl}}/call/base/base/players"
headers:
  - key: X-Internal-Key
    value: "changeme"
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      console.log('answered by', pm.response.headers.get('X-Upstream-Instance'), 'reroutes', pm.response.headers.get('X-Reroutes') || 0);
order: 1000
