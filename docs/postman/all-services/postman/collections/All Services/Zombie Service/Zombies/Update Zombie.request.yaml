name: Update Zombie
$kind: http-request
method: PATCH
url: "{{baseUrl}}/zombies/{{zombieId}}"
headers:
  - key: Content-Type
    value: "application/json"
  - key: X-Internal-Key
    value: "changeme"
body:
  type: json
  content: |-
    {
      "stats": {
        "health": 150,
        "speed": 1,
        "attack": 9,
        "perception": 3
      }
    }
order: 7000
