name: Call With Query String
$kind: http-request
method: GET
url: "http://localhost:8091/call/crafting/recipes?limit=5"
headers:
  - key: X-Internal-Key
    value: "changeme"
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      console.log('answered by', pm.response.headers.get('X-Upstream-Instance'), 'reroutes', pm.response.headers.get('X-Reroutes') || 0);
