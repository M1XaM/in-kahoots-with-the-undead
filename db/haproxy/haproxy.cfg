# One HAProxy per database cluster, under the cluster's old hostname (player-db, base-db, ...), so
# every service keeps its DATABASE_URL / DB_HOST. CLUSTER is that hostname; the Patroni nodes are
# ${CLUSTER}-0, -1 and -2. HAProxy asks each node's Patroni REST API who it is and routes:
#   5432 -> the primary only (GET /primary answers 200 on the leader alone)
#   5433 -> the replicas, round-robin (GET /replica); falls back to the primary if none is up
#   8404 -> GET /healthz (503 while there is no primary), GET /stats
global
  maxconn 1000

defaults
  mode tcp
  timeout connect 3s
  # long-lived pooled connections: let the services' pools decide when to close them
  timeout client 1h
  timeout server 1h
  timeout check 2s
  # a connection that finds no healthy server waits this long, then is closed
  timeout queue 5s
  # a node is resolved again whenever it restarts; one that is missing at start is just down.
  # Once a node stops being what the check wants (primary demoted, node gone) its open
  # connections are cut, so no service keeps writing to a stale primary.
  default-server inter 2s fall 2 rise 2 resolvers docker init-addr last,libc,none on-marked-down shutdown-sessions

# Docker's DNS: a node that restarts may come back with a new IP. A stopped node's name stops
# resolving; its last IP is kept for 30 s so the health check, not the resolver, takes it out:
# only a server marked DOWN by a check gets its open sessions shut (on-marked-down).
resolvers docker
  nameserver dns 127.0.0.11:53
  hold valid 5s
  hold nx 30s
  hold obsolete 30s

frontend primary
  bind :5432
  default_backend primary

frontend replicas
  bind :5433
  use_backend primary if { nbsrv(replicas) eq 0 }
  default_backend replicas

backend primary
  option httpchk GET /primary
  http-check expect status 200
  server node0 "${CLUSTER}-0:5432" check port 8008
  server node1 "${CLUSTER}-1:5432" check port 8008
  server node2 "${CLUSTER}-2:5432" check port 8008

backend replicas
  balance roundrobin
  option httpchk GET /replica
  http-check expect status 200
  server node0 "${CLUSTER}-0:5432" check port 8008
  server node1 "${CLUSTER}-1:5432" check port 8008
  server node2 "${CLUSTER}-2:5432" check port 8008

frontend health
  mode http
  bind :8404
  monitor-uri /healthz
  monitor fail if { nbsrv(primary) lt 1 }
  stats enable
  stats uri /stats
  stats refresh 5s
