      - ./db/world-service/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
  world-db-1:
    <<: *pg-node
    environment:
      <<: *world-db-env
      NODE: world-db-1
    volumes:
      - world-db-1-data:/var/lib/postgresql/data
      - ./db/world-service/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
  world-db-2:
    <<: *pg-node
    environment:
      <<: *world-db-env
      NODE: world-db-2
    volumes:
      - world-db-2-data:/var/lib/postgresql/data
      - ./db/world-service/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
  world-db:
    <<: *pg-router
    environment:
      CLUSTER: world-db
    depends_on:
      - world-db-0
      - world-db-1
      - world-db-2

  # --- zombie-db: Zombie Service's database ---
  zombie-db-0:
    <<: *pg-node
    environment: &zombie-db-env
      <<: *pg-env
      PATRONI_SCOPE: zombie
      NODE: zombie-db-0
      APP_DB: ${ZOMBIE_POSTGRES_DB:-zombie}
      PATRONI_SUPERUSER_USERNAME: ${ZOMBIE_POSTGRES_USER:-postgres}
      PATRONI_SUPERUSER_PASSWORD: ${ZOMBIE_POSTGRES_PASSWORD:-qwerty}
    volumes:
      - zombie-db-0-data:/var/lib/postgresql/data
      - ./db/zombie-service/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
  zombie-db-1:
    <<: *pg-node
    environment:
      <<: *zombie-db-env
      NODE: zombie-db-1
    volumes:
      - zombie-db-1-data:/var/lib/postgresql/data
      - ./db/zombie-service/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
  zombie-db-2:
    <<: *pg-node
    environment:
      <<: *zombie-db-env
      NODE: zombie-db-2
    volumes:
